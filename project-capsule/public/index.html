<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#1d2327" />
  <title>Project Capsule</title>
  <link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%232271b1'/><text x='50%25' y='58%25' font-family='Arial' font-size='36' fill='white' text-anchor='middle' font-weight='700'>P</text></svg>" />
  <link rel="stylesheet" href="/css/wp-dashboard.css" />
</head>
<body>
  <!-- WordPress-style admin bar -->
  <header id="adminbar">
    <div class="ab-left">
      <button id="sidebar-toggle" class="ab-btn" aria-label="Menu">&#9776;</button>
      <span class="ab-logo">🪶 Project Capsule</span>
    </div>
    <div class="ab-right">
      <div class="ab-search">
        <input id="global-search" type="search" placeholder="Zoek in alles…" />
      </div>
      <button class="ab-btn" id="quick-idea-btn" title="Snel idee">+ Idee</button>
      <button class="ab-btn" id="new-project-btn" title="Nieuw project">+ Nieuw</button>
    </div>
  </header>

  <div id="layout">
    <!-- WordPress-style left sidebar -->
    <nav id="sidebar" aria-label="Hoofdmenu">
      <ul>
        <li><a href="#/dashboard"  data-route="dashboard">  <span class="i">▥</span> Dashboard</a></li>
        <li><a href="#/projects"   data-route="projects">   <span class="i">▤</span> Projecten</a></li>
        <li><a href="#/new"        data-route="new">        <span class="i">＋</span> Nieuw project</a></li>
        <li><a href="#/ideas"      data-route="ideas">      <span class="i">💡</span> Ideeën</a></li>
        <li><a href="#/notes"      data-route="notes">      <span class="i">🗒</span> Notities</a></li>
        <li><a href="#/search"     data-route="search">     <span class="i">🔎</span> Zoeken</a></li>
        <li class="sep"></li>
        <li><a href="#/templates"  data-route="templates">  <span class="i">▦</span> Templates</a></li>
        <li><a href="#/devices"    data-route="devices">    <span class="i">⌨</span> Devices</a></li>
        <li><a href="#/remote"     data-route="remote">     <span class="i">🛰</span> Remote access</a></li>
        <li><a href="#/scan"       data-route="scan">       <span class="i">⟳</span> Map-scan</a></li>
      </ul>
    </nav>

    <!-- Main content area -->
    <main id="content">
      <div id="notice" class="notice" hidden></div>
      <div id="view"></div>
    </main>
  </div>

  <!-- Modal container -->
  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop"></div>
    <div class="modal-dialog" role="dialog" aria-modal="true">
      <header><h2 id="modal-title">Titel</h2><button class="modal-close" aria-label="Sluiten">×</button></header>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/views/dashboard.js"></script>
  <script src="/js/views/projects.js"></script>
  <script src="/js/views/new-project.js"></script>
  <script src="/js/views/project-detail.js"></script>
  <script src="/js/views/ideas.js"></script>
  <script src="/js/views/notes.js"></script>
  <script src="/js/views/search.js"></script>
  <script src="/js/views/templates.js"></script>
  <script src="/js/views/devices.js"></script>
  <script src="/js/views/remote.js"></script>
  <script src="/js/views/scan.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
